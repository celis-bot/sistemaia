# Balanceador de cargas nginx para el backend Node (self-hosted / VM).
# En Vercel el balanceo lo hace la plataforma; este archivo es para deploys
# en VPS/VM con multiples instancias del API.
#
# Uso:
#   1. Levantar N instancias:  CLUSTER_WORKERS=4 PORT=4000 node src/cluster.js
#      o PM2: pm2 start src/server.js -i max
#   2. nginx -c infra/nginx.conf

upstream api_backend {
    least_conn;               # balanceo por menor conexiones activas
    server 127.0.0.1:4000;
    server 127.0.0.1:4001;
    server 127.0.0.1:4002;
    # health check pasivo via max_fails
    keepalive 32;
}

server {
    listen 80;
    server_name api.tudominio.com;

    location /api/ {
        proxy_pass http://api_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # timeouts
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;

        # reintento en otro worker si uno falla
        proxy_next_upstream error timeout http_502 http_503;
        proxy_next_upstream_tries 2;
    }

    location /api/health {
        proxy_pass http://api_backend/api/health;
        access_log off;
    }
}
